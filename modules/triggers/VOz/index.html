<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voz — GrimIA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  #btn { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #444; background: #16213e; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  #btn:hover { border-color: #0f3460; }
  #btn.recording { border-color: #e94560; background: #2a1a2e; box-shadow: 0 0 30px rgba(233,69,96,0.4); }
  #btn.thinking { border-color: #f0a500; background: #2a2a1e; box-shadow: 0 0 30px rgba(240,165,0,0.3); animation: pulse 1.5s infinite; }
  #btn:active { transform: scale(0.95); }
  #btn svg { width: 48px; height: 48px; fill: #888; transition: fill 0.15s; }
  #btn.recording svg { fill: #e94560; }
  #btn.thinking svg { fill: #f0a500; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  #status { margin-top: 20px; font-size: 14px; color: #666; min-height: 20px; }
  #log { margin-top: 24px; max-width: 600px; width: 90%; min-height: 60px; max-height: 300px; overflow-y: auto; padding: 16px; background: #16213e; border-radius: 8px; font-size: 14px; line-height: 1.6; }
  .log-entry { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #1a1a3e; }
  .log-entry .q { color: #e94560; }
  .log-entry .a { color: #4caf50; }
  #hint { margin-top: 12px; font-size: 12px; color: #555; }
  #ws-status { margin-bottom: 16px; font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: #4caf50; }
  .dot.off { background: #e94560; }
</style>
</head>
<body>
  <div id="ws-status"><span class="dot off" id="dot"></span><span id="ws-label">Desconectado</span></div>
  <button id="btn">
    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15a.998.998 0 0 0-.98-.85c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08a6.993 6.993 0 0 0 5.91-5.78c.1-.6-.39-1.14-1-1.14z"/></svg>
  </button>
  <div id="status">Conectando...</div>
  <div id="log"></div>
  <div id="hint">Hotkey: presiona <b>+</b> para hablar con Grim (respuesta por TTS)</div>

<script>
const btn = document.getElementById('btn');
const status = document.getElementById('status');
const log = document.getElementById('log');
const dot = document.getElementById('dot');
const wsLabel = document.getElementById('ws-label');
let recorder = null;
let chunks = [];
let recording = false;

function connectWS() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { dot.className = 'dot on'; wsLabel.textContent = 'Conectado'; status.textContent = 'Listo — presiona + para hablar'; };
  ws.onclose = () => { dot.className = 'dot off'; wsLabel.textContent = 'Reconectando...'; setTimeout(connectWS, 2000); };
  ws.onmessage = e => {
    if (e.data === 'start') startRecording();
    else if (e.data === 'stop') stopRecording();
  };
}
connectWS();

btn.addEventListener('mousedown', () => recording || startRecording());
btn.addEventListener('mouseup', () => recording && stopRecording());
btn.addEventListener('mouseleave', () => recording && stopRecording());
btn.addEventListener('touchstart', e => { e.preventDefault(); if (!recording) startRecording(); });
btn.addEventListener('touchend', e => { e.preventDefault(); if (recording) stopRecording(); });

async function startRecording() {
  if (recording) return;
  recording = true;
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  recorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
  chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.start();
  btn.classList.add('recording');
  status.textContent = 'Grabando...';
}

function stopRecording() {
  if (!recorder || recorder.state !== 'recording') return;
  recording = false;
  recorder.stop();
  recorder.stream.getTracks().forEach(t => t.stop());
  btn.classList.remove('recording');
  status.textContent = 'Transcribiendo...';

  recorder.onstop = async () => {
    const blob = new Blob(chunks, { type: 'audio/webm' });
    if (blob.size < 1000) { status.textContent = 'Listo — presiona + para hablar'; return; }

    btn.classList.add('thinking');
    status.textContent = 'Grim pensando...';

    const form = new FormData();
    form.append('file', blob, 'audio.webm');
    try {
      const res = await fetch('/ask', { method: 'POST', body: form });
      const data = await res.json();
      btn.classList.remove('thinking');
      if (data.text) {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = '<span class="q">Yo:</span> ' + escHtml(data.text);
        if (data.reply) {
          entry.innerHTML += '<br><span class="a">Grim:</span> ' + escHtml(data.reply);
        }
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
      }
      status.textContent = 'Listo — presiona + para hablar';
    } catch (err) {
      btn.classList.remove('thinking');
      status.textContent = 'Error: ' + err.message;
    }
  };
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
