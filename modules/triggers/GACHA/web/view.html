<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista de Personaje</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/view.css">
</head>
<body>
    <div id="character-card-container" class="hidden">
        <!-- Overlay - fade in/out separately -->
        <div id="overlay"></div>

        <!-- Card Container for sizing -->
        <div class="card-container">
            <div id="card-flipper" class="card-flipper">
                
                <!-- Card Back -->
                <div class="card-face card-back">
                    <img src="https://github.com/mrsnakke/gachaIMG/blob/main/back.png?raw=true" alt="Card Back" class="w-full h-full object-cover" />
                </div>

                <!-- Card Front -->
                <div class="card-face">
                    <!-- Liquid Glass Background & Glow -->
                    <div class="glass-bg"></div>
                    
                    <!-- Character Image -->
                    <img
                        id="character-image"
                        src=""
                        alt="Imagen del personaje"
                        class="absolute inset-0 w-full h-full object-cover"
                    />

                    <!-- Content Gradient Overlay -->
                    <div class="gradient-overlay"></div>
                    
                    <div class="content-container">
                        <div class="flex-grow"></div>
                        
                        <!-- Name -->
                        <h2 id="character-name" class="character-name">
                            <!-- Character Name Here -->
                        </h2>

                        <!-- Stars -->
                        <div id="character-stars" class="stars-container">
                            <!-- Star Icons Here -->
                        </div>

                        <!-- "Do you have it?" message -->
                        <div id="user-owns-character-status" class="status-box">
                            <span id="user-owns-character-text" class="status-text">
                                <!-- Ownership Status Here -->
                            </span>
                        </div>

                        <!-- Stats & Owners Container -->
                        <div class="stats-container">
                            <!-- Inventory Stat -->
                            <div class="stat-item">
                                <svg id="inventory-icon" class="inventory-icon" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2h-2zM11 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2h-2z"></path>
                                </svg>
                                <div class="text-left">
                                    <span class="stat-label">Total en Inventarios</span>
                                    <p id="total-in-inventories" class="stat-value"></p>
                                </div>
                            </div>

                            <!-- Owners List Box -->
                            <div class="owners-box">
                                <div class="owners-header">
                                    <svg id="owners-icon" class="owners-icon" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                                    </svg>
                                    <h4 class="owners-title">Propietarios</h4>
                                </div>
                                <ul id="character-owners" class="owners-list animate-fade-in-out custom-scrollbar">
                                    <!-- Owner Names Here -->
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/view.js"></script>
</body>
</html>
