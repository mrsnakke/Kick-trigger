<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha — Vista de Personaje</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/view.css">
</head>
<body>
    <!-- ===================== CARTA DE PERSONAJE ===================== -->
    <section id="character-card" class="stage hidden" aria-live="polite">
        <article id="card-flipper" class="card">
            <div class="card__art">
                <img id="character-image" src="" alt="">
                <div class="card__scrim"></div>
                <div id="character-stars" class="stars r3" aria-hidden="true"></div>
                <h2 id="character-name" class="card__name"></h2>
            </div>

            <div class="card__panel">
                <div id="character-ownership" class="badge badge--miss"></div>
                <div class="chips">
                    <div class="chip">
                        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path d="M5 3a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H5Zm6 0a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2ZM5 11a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2H5Zm6 0a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-2Z"/>
                        </svg>
                        <span class="chip__label">Total en inventarios</span>
                        <strong id="total-in-inventories" class="chip__value">0</strong>
                    </div>
                </div>
            </div>

            <div class="card__owners">
                <span class="owners__label">Propietarios</span>
                <div class="owners__viewport">
                    <div id="character-owners" class="owners__track"></div>
                </div>
            </div>
        </article>
    </section>

    <!-- ===================== INVENTARIO ===================== -->
    <section id="inventory-view" class="stage hidden" aria-live="polite">
        <div id="inv-panel" class="inv">
            <header class="inv__head">
                <h2 id="inv-title" class="inv__title"></h2>
                <div id="inv-hud" class="inv__hud"></div>
            </header>

            <div id="inv-stage" class="inv__stage">
                <div id="inv-preview" class="inv__preview r5">
                    <img id="inv-image" src="" alt="">
                    <div id="inv-fallback" class="inv__fallback"></div>
                </div>
                <div class="inv__meta">
                    <div id="inv-name" class="inv__name"></div>
                    <div id="inv-stars" class="inv__stars r5" aria-hidden="true"></div>
                    <div id="inv-note" class="inv__note"></div>
                </div>
            </div>

            <div class="inv__progress">
                <span class="inv__label">Obtenibles</span>
                <div class="prog"><i id="inv-prog-fill"></i></div>
                <span id="inv-prog-count" class="inv__count"></span>
            </div>

            <div class="inv__missing">
                <span class="inv__label">Te faltan</span>
                <div id="inv-missing" class="missing-strip"></div>
                <span id="inv-missing-count" class="inv__count"></span>
            </div>
        </div>
    </section>

    <script src="js/view.js"></script>
</body>
</html>
