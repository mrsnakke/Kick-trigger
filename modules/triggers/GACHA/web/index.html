<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha — Tiradas</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/gachaAnimations.css">
</head>
<body>
    <div id="websocket-status-indicator" title="Estado WebSocket"></div>

    <div id="wrapper">
        <div id="test-message-display" class="hidden"></div>

        <!-- Máquina de gashapon antes del resultado -->
        <div id="gashapon-animation" class="hidden">
            <img src="img/gashapon.gif" alt="Máquina gashapon" id="gashapon-machine-img">
        </div>

        <!-- Tirada simple -->
        <div id="single-pull-display" class="hidden">
            <div id="single-pull-redeemer" class="redeemer-name"></div>
            <div id="single-pull-card" class="single-card-slot"></div>
            <div id="single-character-name" class="character-name"></div>
        </div>

        <!-- Tirada múltiple (10) -->
        <div id="multi-pull-display" class="hidden">
            <div id="multi-pull-grid" class="card-grid"></div>
        </div>

        <!-- Revelado ampliado de 4★ / 5★ -->
        <div id="multi-rarity-reveal-display" class="hidden"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script type="module" src="js/gachaAnimations.js"></script>
    <script type="module" src="js/websocket.js"></script>
</body>
</html>
