<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VTS Test Panel</title>
<style>
* { box-sizing: border-box; }
body { font-family: monospace; background: #111; color: #eee; padding: 15px; font-size: 14px; margin: 0; }
input, button, select { font-family: monospace; font-size: 13px; padding: 5px 10px; margin: 3px; background: #222; color: #0f0; border: 1px solid #0a0; border-radius: 3px; }
button { cursor: pointer; background: #0a0; color: #000; font-weight: bold; }
button:hover { background: #0f0; }
button.danger { background: #a00; color: #fff; }
button.danger:hover { background: #f00; }
h2 { margin: 0 0 8px; color: #0c0; }
h3 { margin: 10px 0 5px; color: #0c0; border-bottom: 1px solid #333; padding-bottom: 4px; }
#log { background: #000; border: 1px solid #333; padding: 6px; height: 150px; overflow-y: auto; font-size: 11px; line-height: 1.3; }
#log div { border-bottom: 1px solid #1a1a1a; padding: 1px 0; }
.row { margin: 3px 0; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.section { border: 1px solid #333; padding: 10px; margin: 8px 0; background: #0d0d0d; border-radius: 4px; }
.expr-btn { min-width: 180px; text-align: left; }
.expr-btn.active { background: #0a0; color: #000; border-color: #0f0; }
.mapping { background: #1a1a1a; padding: 6px; border-radius: 4px; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
.suggest { background: #111; padding: 6px; border: 1px dashed #555; border-radius: 4px; font-size: 11px; margin-top: 6px; }
.flex-wrap { display: flex; gap: 10px; flex-wrap: wrap; }
.flex-wrap > div { flex: 1; min-width: 280px; }
</style>
</head>
<body>
<h2>VTS Test Panel</h2>

<div class="section">
  <div class="row">
    <label>Host:</label><input id="host" value="localhost" size="10">
    <label>Puerto:</label><input id="port" value="8001" size="4">
    <label>Plugin:</label><input id="pluginName" value="ExpTest" size="10">
    <label>Dev:</label><input id="developer" value="dev" size="8">
    <button onclick="connect()">Reconectar</button>
    <button class="danger" onclick="disconnect()">Desconectar</button>
    <span id="status" style="color:#888;margin-left:6px">Conectando...</span>
  </div>
</div>

<div id="mainPanel" style="display:none">
  <div class="flex-wrap">
    <div class="section">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <h3 style="border:none;margin:0">Expresiones</h3>
        <div class="row" style="margin:0">
          <label style="font-size:12px;color:#aaa"><input type="checkbox" id="tempMode" checked onchange="updateTempUI()"> Temporal</label>
          <input type="range" id="tempDur" min="500" max="10000" step="500" value="3000" oninput="document.getElementById('tempDurVal').textContent=(this.value/1000).toFixed(1)+'s'" style="width:60px">
          <span id="tempDurVal" style="font-size:11px;color:#888;min-width:30px">3.0s</span>
        </div>
      </div>
      <div class="row"><button onclick="refreshExpressions()">↻ Refrescar</button> <span id="modelName" style="color:#888;font-size:12px"></span></div>
      <div id="exprList"></div>
    </div>

    <div class="section">
      <h3>Emociones Rápidas</h3>
      <div id="quickEmotions"></div>
      <div class="row" style="margin-top:8px">
        <button onclick="activateEmotion('expression1.exp3.json')">expression1 (molesta)</button>
        <button onclick="activateEmotion('expression2.exp3.json')">expression2 (sonrojo)</button>
        <button onclick="activateEmotion('expression6.exp3.json')">expression6 (feliz)</button>
        <button onclick="activateEmotion('expression9.exp3.json')">expression9 (llorando)</button>
        <button onclick="activateEmotion('lengua.exp3.json')">lengua (lengua)</button>
      </div>
      <div class="row"><button onclick="resetAll()">Reset All</button> <span style="font-size:11px;color:#666">(desactiva todas)</span></div>
    </div>
  </div>

  <div class="section">
    <h3>Model Dict Sugerido</h3>
    <div class="mapping" id="suggestedMapping"></div>
    <button onclick="copyMapping()" style="margin-top:4px">📋 Copiar</button>
  </div>
</div>

<h3>Log</h3>
<div id="log"></div>

<script>
// ---- Mini VTS Client (inline) ----
let ws = null, authed = false, reqId = 0, pending = {}
let savedToken = localStorage.getItem('vts_token') || null
let expressionsCache = []

function genId() { return String(++reqId) }
function send(msg) {
  return new Promise((resolve, reject) => {
    msg.requestID = genId()
    msg.apiName = 'VTubeStudioPublicAPI'
    msg.apiVersion = '1.0'
    pending[msg.requestID] = resolve
    if (!ws || ws.readyState !== 1) { delete pending[msg.requestID]; reject(new Error('Socket not open')); return }
    try { ws.send(JSON.stringify(msg)) } catch (e) { delete pending[msg.requestID]; reject(e) }
    setTimeout(() => { if (pending[msg.requestID]) { delete pending[msg.requestID]; reject(new Error('Timeout')) } }, 8000)
  })
}
function log(msg, type) {
  const el = document.getElementById('log')
  const d = document.createElement('div')
  d.textContent = (type||'') + ' ' + msg
  el.appendChild(d)
  el.scrollTop = el.scrollHeight
}
function setStatus(s) { document.getElementById('status').textContent = s }

function connect() {
  if (ws) { try { ws.close() } catch {}; ws = null }
  const host = document.getElementById('host').value
  const port = document.getElementById('port').value
  const url = 'ws://' + host + ':' + port
  log('Conectando a ' + url)
  setStatus('Conectando...')
  try { ws = new WebSocket(url) } catch (e) { log('Error: ' + e.message, '❌'); setStatus('Error'); return }
  ws.onmessage = function(e) {
    var r; try { r = JSON.parse(e.data) } catch { return }
    var cb = pending[r.requestID]
    if (cb) { delete pending[r.requestID]; cb(r); return }
    if (r.messageType && r.messageType.endsWith('Event')) log('Evento: ' + r.messageType, '📡')
  }
  ws.onopen = function() { log('Conectado!', '✅'); setStatus('Conectado'); authenticate() }
  ws.onerror = function() { log('Error de conexion', '❌'); setStatus('Error') }
  ws.onclose = function() {
    log('Desconectado', '❌'); setStatus('Desconectado'); authed = false
    document.getElementById('mainPanel').style.display = 'none'
  }
}

function disconnect() { if (ws) { ws.close(); ws = null } authed = false; document.getElementById('mainPanel').style.display = 'none'; setStatus('Desconectado') }

async function authenticate() {
  const pluginName = document.getElementById('pluginName').value
  const developer = document.getElementById('developer').value
  if (savedToken) {
    log('Usando token guardado...')
    try {
      const r = await send({ messageType: 'AuthenticationRequest', data: { pluginName, pluginDeveloper: developer, authenticationToken: savedToken } })
      if (r.data && r.data.authenticated) { authed = true; log('Autenticado!', '✅'); onAuthed(); return }
    } catch {}
    log('Token invalido'); savedToken = null; localStorage.removeItem('vts_token')
  }
  try {
    const r = await send({ messageType: 'AuthenticationTokenRequest', data: { pluginName, pluginDeveloper: developer } })
    if (r.data && r.data.authenticationToken) {
      savedToken = r.data.authenticationToken; localStorage.setItem('vts_token', savedToken); log('Token recibido y guardado')
      const r2 = await send({ messageType: 'AuthenticationRequest', data: { pluginName, pluginDeveloper: developer, authenticationToken: savedToken } })
      if (r2.data && r2.data.authenticated) { authed = true; log('Autenticado!', '✅'); onAuthed(); return }
    }
    log('Autenticacion fallida')
  } catch (e) { log('Error auth: ' + e.message, '❌') }
}

function updateTempUI() {
  document.getElementById('tempDur').style.opacity = document.getElementById('tempMode').checked ? '1' : '0.4'
}

let _exprTimers = []

function clearExprTimers() {
  for (const t of _exprTimers) clearTimeout(t)
  _exprTimers = []
}

function getTempMs() { return parseInt(document.getElementById('tempDur').value) }

function onAuthed() {
  document.getElementById('mainPanel').style.display = 'block'
  updateTempUI()
  refreshExpressions()
  buildQuickEmotions()
}

// ---- Expressions ----
async function refreshExpressions() {
  const list = document.getElementById('exprList')
  list.innerHTML = '<span style="color:#888">Cargando...</span>'
  try {
    const modelR = await send({ messageType: 'CurrentModelRequest' })
    document.getElementById('modelName').textContent = modelR.data?.modelLoaded ? modelR.data.modelName + ' (' + modelR.data.modelID + ')' : 'Sin modelo cargado'
    const r = await send({ messageType: 'ExpressionStateRequest', data: { details: true } })
    list.innerHTML = ''
    if (!r.data?.expressions?.length) {
      list.innerHTML = '<span style="color:#888">No hay expresiones en este modelo</span>'
      document.getElementById('suggestedMapping').textContent = 'Sin expresiones disponibles'
      expressionsCache = []
      return
    }
    expressionsCache = r.data.expressions
    expressionsCache.sort(function(a,b) { return a.file.localeCompare(b.file) })
    for (const ex of expressionsCache) {
      const div = document.createElement('div')
      div.className = 'row'
      const btn = document.createElement('button')
      btn.className = 'expr-btn' + (ex.active ? ' active' : '')
      btn.textContent = (ex.active ? '🟢 ' : '⚪ ') + ex.file
      btn.onclick = function() { toggleExpression(ex.file, !ex.active, btn) }
      const label = document.createElement('span')
      label.style.cssText = 'font-size:11px;color:#888'
      label.textContent = ex.name
      div.appendChild(btn)
      div.appendChild(label)
      list.appendChild(div)
    }
    buildSuggestedMapping(expressionsCache)
  } catch (e) { list.innerHTML = '<span style="color:#f00">Error: ' + e.message + '</span>' }
}

async function toggleExpression(file, active, btn) {
  try {
    if (active) {
      await send({ messageType: 'ExpressionActivationRequest', data: { expressionFile: file, active: true, fadeTime: 0.3 } })
      btn.className = 'expr-btn active'
      btn.textContent = '🟢 ' + file
      log(file + ' activada')
      if (document.getElementById('tempMode').checked) {
        clearExprTimers()
        _exprTimers.push(setTimeout(async function() {
          try {
            await send({ messageType: 'ExpressionActivationRequest', data: { expressionFile: file, active: false, fadeTime: 0.3 } })
            btn.className = 'expr-btn'
            btn.textContent = '⚪ ' + file
          } catch {}
        }, getTempMs()))
      }
    } else {
      await send({ messageType: 'ExpressionActivationRequest', data: { expressionFile: file, active: false, fadeTime: 0.3 } })
      btn.className = 'expr-btn'
      btn.textContent = '⚪ ' + file
      log(file + ' desactivada')
    }
  } catch (e) { log('Error: ' + e.message, '❌') }
}

async function activateEmotion(file) {
  try {
    clearExprTimers()
    const r = await send({ messageType: 'ExpressionStateRequest', data: { details: false } })
    if (r.data?.expressions) {
      for (const ex of r.data.expressions) {
        if (ex.active) await send({ messageType: 'ExpressionActivationRequest', data: { expressionFile: ex.file, active: false, fadeTime: 0.1 } })
      }
    }
    await send({ messageType: 'ExpressionActivationRequest', data: { expressionFile: file, active: true, fadeTime: 0.3 } })
    log(file + ' activada')
    if (document.getElementById('tempMode').checked) {
      _exprTimers.push(setTimeout(async function() {
        try {
          await send({ messageType: 'ExpressionActivationRequest', data: { expressionFile: file, active: false, fadeTime: 0.3 } })
        } catch {}
        refreshExpressions()
      }, getTempMs()))
    }
    refreshExpressions()
  } catch (e) { log('Error: ' + e.message, '❌') }
}

async function resetAll() {
  try {
    clearExprTimers()
    const r = await send({ messageType: 'ExpressionStateRequest', data: { details: false } })
    if (r.data?.expressions) {
      for (const ex of r.data.expressions) {
        if (ex.active) await send({ messageType: 'ExpressionActivationRequest', data: { expressionFile: ex.file, active: false, fadeTime: 0.2 } })
      }
    }
    log('Todas desactivadas (neutral)')
    refreshExpressions()
  } catch (e) { log('Error reset: ' + e.message, '❌') }
}

// ---- Quick Emotions ----
const EMOTION_MAP = [
  ['joy', 'expression6.exp3.json', '😊 Felicidad'],
  ['sadness', 'expression9.exp3.json', '😢 Tristeza'],
  ['anger', 'expression1.exp3.json', '😠 Molesta'],
  ['surprise', 'expression3.exp3.json', '😲 Sorpresa'],
  ['blush', 'expression2.exp3.json', '😳 Sonrojo'],
  ['lengua', 'lengua.exp3.json', '👅 Lengua'],
]

function buildQuickEmotions() {
  const container = document.getElementById('quickEmotions')
  container.innerHTML = ''
  for (const [key, file, label] of EMOTION_MAP) {
    const btn = document.createElement('button')
    btn.textContent = label
    btn.style.cssText = 'margin:3px;min-width:110px'
    btn.onclick = function() { activateEmotion(file) }
    container.appendChild(btn)
  }
}

// ---- Suggested Mapping ----
function buildSuggestedMapping(exprs) {
  const mapping = { joy: 'expression6.exp3.json', sadness: 'expression9.exp3.json', anger: 'expression1.exp3.json', surprise: 'expression3.exp3.json', blush: 'expression2.exp3.json', lengua: 'lengua.exp3.json', neutral: '' }
  let text = '[\n  {\n    "name": "Grim",\n    "emotionMap": {\n'
  for (const [em, file] of Object.entries(mapping)) {
    text += '      "' + em + '": "' + file + '",\n'
  }
  text = text.replace(/,\n$/, '\n') + '    }\n  }\n]'
  document.getElementById('suggestedMapping').textContent = text
  const used = new Set(Object.values(mapping).filter(Boolean))
  const extra = exprs.filter(function(e) { return !used.has(e.file) })
  const existing = document.querySelector('.suggest')
  if (existing) existing.remove()
  if (extra.length) {
    const note = document.createElement('div')
    note.className = 'suggest'
    note.textContent = '📌 Sin mapear: ' + extra.map(function(e) { return e.file + ' (' + e.name + ')' }).join(', ')
    document.querySelector('.mapping').after(note)
  }
}

function copyMapping() {
  navigator.clipboard.writeText(document.getElementById('suggestedMapping').textContent)
    .then(function() { log('Mapping copiado') })
}

// ---- Auto-connect on page load ----
setTimeout(function() {
  if (!ws || ws.readyState > 1) connect()
}, 500)
</script>
</body>
</html>
